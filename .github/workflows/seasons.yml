name: Update fruit seasons

# Server-side equivalent of a commit hook: the picking routine publishes
# picking.json via the GitHub Contents API (no local commit), so this runs on
# the resulting push and maintains seasons.json deterministically. The routine
# never touches seasons.json. Filtered to picking.json so the bot's own
# commit can't retrigger it.
on:
  push:
    branches: [main]
    paths:
      - picking.json
  workflow_dispatch: {} # allow manual runs (smoke test / reruns)

permissions:
  contents: write

jobs:
  seasons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deterministic backstop: if the model-driven publish step double-base64
      # -encoded picking.json (happened 2026-07-29, -30), decode it in place so
      # the feed + seasons self-heal regardless of how it was published.
      - name: Repair picking.json if double-encoded
        run: python3 scripts/repair_picking.py
      - name: Update seasons.json
        run: python3 scripts/update_seasons.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain picking.json seasons.json)" ]; then
            git config user.name "scout-seasons-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add picking.json seasons.json
            git commit -m "chore: repair feed / update seasons [skip ci]"
            git push
          else
            echo "picking.json + seasons.json unchanged"
          fi
